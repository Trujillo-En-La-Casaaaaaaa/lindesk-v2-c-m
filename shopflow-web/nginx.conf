# Static SPA host for the ShopFlow web bundle.
# The browser talks to shopflow-api directly, so there is deliberately no API proxy here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/orders/:id, /admin) must reach the React app.
    location / {
        try_files $uri /index.html;
    }

    # index.html is rebuilt on every deploy and must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

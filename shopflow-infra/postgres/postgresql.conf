# =============================================================================
# ShopFlow local PostgreSQL 16 server configuration
# -----------------------------------------------------------------------------
# Mounted read-only into the `postgres` service at /etc/shopflow/postgresql.conf and
# activated with:
#
#   command: ["postgres", "-c", "config_file=/etc/shopflow/postgresql.conf"]
#
# Because a custom `config_file` replaces the generated $PGDATA/postgresql.conf, every
# setting the container image would otherwise provide must be stated explicitly here.
# In particular `unix_socket_directories` is what makes the `pg_isready` health check
# (which connects over the local socket) work.
#
# This is a local development configuration: it is deterministic, small, and bounded.
# It never overrides authentication (pg_hba.conf stays the image default, which is
# password / scram-sha-256 for host connections).
# =============================================================================

# --- connections -------------------------------------------------------------
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# --- memory (bounded: sized for a local single-host stack, not a server) -----
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
temp_buffers = 8MB
dynamic_shared_memory_type = posix

# --- write ahead log / checkpoints ------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# --- planner / statistics ----------------------------------------------------
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# --- timeouts (a stuck local query must not hold the stack hostage) --------
statement_timeout = 30s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s

# --- locale / time -----------------------------------------------------------
# The API stores and returns ISO-8601 UTC timestamps, so the server runs in UTC.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# --- autovacuum --------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- logging -----------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d '

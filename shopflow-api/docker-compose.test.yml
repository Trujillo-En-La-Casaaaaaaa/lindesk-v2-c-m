# Test-only PostgreSQL 16 for the integration and contract suites of shopflow-api.
# It is NOT the system entrypoint: shopflow-infra owns runtime orchestration.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL default: postgres://shopflow:shopflow@localhost:55432/shopflow_test
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: shopflow-api-postgres-test
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
